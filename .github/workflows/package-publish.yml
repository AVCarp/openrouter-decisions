name: package-publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm i -g clawhub
      - name: Authenticate ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |-
          clawhub auth login --token "$CLAWHUB_TOKEN" --label github-actions --no-browser
          clawhub whoami
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |-
          VER="${GITHUB_REF_NAME#v}"
          clawhub package publish . \
            --family code-plugin \
            --owner AVCarp \
            --source-repo AVCarp/openrouter-decisions \
            --version "$VER" \
            --changelog "v$VER: TypeScript port, full decisions model catalog" \
            --no-input
