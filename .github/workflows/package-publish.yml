name: package-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify publish ref
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package-publish must run on a vX.Y.Z tag ref (got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME})"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npm i -g clawhub@0.23.3
      - name: Authenticate ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |-
          clawhub auth login --token "$CLAWHUB_TOKEN" --label github-actions --no-browser
          clawhub whoami
      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |-
          VER="${GITHUB_REF_NAME#v}"
          clawhub package publish . \
            --family code-plugin \
            --owner AVCarp \
            --source-repo AVCarp/openrouter-decisions \
            --version "$VER" \
            --changelog "v$VER: TypeScript port, full decisions model catalog" \
            --no-input
