name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump to apply before releasing'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Guard against divergence
        run: |
          git fetch origin
          behind=$(git rev-list --count HEAD..origin/main)
          if [ "$behind" -gt 0 ]; then
            echo "::error::${{ github.ref_name }} is behind origin/main by $behind commit(s) — reconcile (git pull --rebase) and rerun"
            exit 1
          fi
      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Sync manifest version
        run: node scripts/bump-manifest-version.mjs "${{ steps.bump.outputs.version }}"
      - name: Commit and tag
        run: |
          git add package.json openclaw.plugin.json
          git commit -m "chore: v${{ steps.bump.outputs.version }}"
          git tag "${{ steps.bump.outputs.tag }}"
      - name: Push branch and tag
        # one atomic push so the tag never lands without its commit
        run: git push --atomic origin HEAD "${{ steps.bump.outputs.tag }}"
      - name: Dispatch package publish
        # a tag pushed with the default GITHUB_TOKEN does not trigger the
        # publish workflow by itself, so dispatch it explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attempt=1
          until gh workflow run package-publish.yml --ref "${{ steps.bump.outputs.tag }}"; do
            if [ "$attempt" -ge 3 ]; then
              echo "::error::failed to dispatch package publish for ${{ steps.bump.outputs.tag }} after 3 attempts — rerun with: gh workflow run package-publish.yml --ref ${{ steps.bump.outputs.tag }}" >&2
              exit 1
            fi
            sleep 5
            attempt=$((attempt + 1))
          done
